<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">人造天体 · Artificial Celestial Bodies</title>
  <meta name="description" content="A 3D interactive viewer of human-made spacecraft and probes across the solar system and beyond." />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='10' fill='%2300e5ff'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%2300e5ff' stroke-width='2' opacity='.5'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text" data-i18n="loading">正在加载星图…</div>
  </div>

  <header class="hud top-bar">
    <div class="brand">
      <span class="logo"></span>
      <span class="brand-text" data-i18n="brand">人造天体浏览器</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:search_placeholder" placeholder="搜索：旅行者、韦伯、火星车…" />
      <ul id="search-results"></ul>
    </div>
    <div class="lang-switch">
      <button data-lang="zh" class="active">中文</button>
      <button data-lang="en">EN</button>
      <button data-lang="ja">日本語</button>
    </div>
  </header>

  <aside id="info-panel" class="hud hidden">
    <button class="close-btn" id="close-info" aria-label="close">×</button>
    <div class="info-tag" id="info-category"></div>
    <h2 id="info-name"></h2>
    <div class="info-meta" id="info-meta"></div>
    <p id="info-description"></p>
    <div class="info-stats" id="info-stats"></div>
    <a id="info-link" target="_blank" rel="noopener noreferrer" class="info-link"></a>
  </aside>

  <div class="hud bottom-bar">
    <div class="legend">
      <span class="dot earth"></span><span data-i18n="cat_earth">地球轨道</span>
      <span class="dot moon"></span><span data-i18n="cat_moon">月球</span>
      <span class="dot mars"></span><span data-i18n="cat_mars">火星</span>
      <span class="dot inner"></span><span data-i18n="cat_inner">内太阳系</span>
      <span class="dot outer"></span><span data-i18n="cat_outer">外太阳系</span>
      <span class="dot deep"></span><span data-i18n="cat_deep">星际空间</span>
    </div>
    <div class="hint" data-i18n="hint">拖拽旋转 · 滚轮缩放 · 点击天体飞近查看</div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
